name: Refresh IPTV

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-iptv
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch, decrypt, convert, clean and classify
        run: python scripts/refresh_iptv.py

      - name: Commit refreshed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.txt README.md
          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            CHANNELS=$(python -c "import json; print(json.load(open('refresh-result.json'))['channels'])")
            git commit -m "刷新 TVBox 直播源（${CHANNELS} 个频道）"
            git push
          fi

      - name: Publish job summary
        if: always()
        run: |
          if [ -f refresh-result.json ]; then
            echo "## IPTV Refresh Result" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`json" >> "$GITHUB_STEP_SUMMARY"
            cat refresh-result.json >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          fi
